name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.140.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so hugo's enableGitInfo can derive real Lastmod dates.
          fetch-depth: 0

      - name: Setup Hugo (extended)
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O hugo.deb
          sudo dpkg -i hugo.deb

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Validate notes
        run: uv run scripts/validate-notes.py --strict

      - name: Build site
        run: |
          set -o pipefail
          hugo --logLevel info 2>&1 | tee hugo-build.log

      # A warning-producing build is never published.
      - name: Assert no Hugo warnings
        run: |
          if grep -iE "\bWARN\b|\bERROR\b" hugo-build.log; then
            echo "::error::Hugo emitted warnings/errors"
            exit 1
          fi

      - name: Build search index
        run: npx --yes pagefind@1 --site public

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
