name: Build and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so hugo's enableGitInfo can derive real Lastmod dates.
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Validate notes
        run: uv run scripts/validate-notes.py --strict

      - name: Build site
        run: |
          set -o pipefail
          hugo --logLevel info 2>&1 | tee hugo-build.log

      # A warning-producing build is never published.
      - name: Assert no Hugo warnings
        run: |
          if grep -iE "\bWARN\b|\bERROR\b" hugo-build.log; then
            echo "::error::Hugo emitted warnings/errors"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build search index
        run: npx --yes pagefind@1 --site public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
