name: Build and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro refuses to run below 22.23.4; the runner's bundled Node is older.
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup uv
        # Exact tag: this action publishes floating majors only up to v7.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # No lockfile in this repo (scripts use inline PEP 723 deps), so uv's
          # cache would never invalidate. Keep CI honest and skip it.
          enable-cache: false

      - name: Validate notes
        run: uv run scripts/validate-notes.py --strict

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Type gate: `astro check` fails the job on a content-schema or prop
      # mismatch, which is the Astro replacement for the old Hugo WARN grep.
      - name: Type-check
        run: bunx astro check

      - name: Build site
        run: bunx astro build

      - name: Build search index
        run: bunx pagefind --site dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
