{{ define "main" }}
<section class="hero">
  <h1>{{ .Title }}</h1>
  <div>{{ .Content }}</div>
</section>

<h2>Projects</h2>
<div class="grid">
  {{ with site.GetPage "/projects" }}
    {{ range (.Pages).ByTitle }}
      {{ partial "project-card.html" . }}
    {{ end }}
  {{ end }}
</div>
{{ end }}
